[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "template_repo"
version = "0.1.0"
description = "template_repo"
authors = [
  { name = "Peter Mads Pedersen", email = "petermads123@hotmail.com" }
]
readme = "README.md"
requires-python = ">=3.13"

# Runtime dependencies
dependencies = []

# Optional groups (e.g. dev dependencies)
[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "mypy",
]

[tool.setuptools.packages.find]
where = ["."]
# Excluding rather than including means renaming the package folder needs no
# change here.
exclude = ["tests*"]

# --- Ruff Configuration ---
[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "I", "F", "B", "ANN", "D", "UP", "TID", "N", "SIM", "ARG", "ERA", "DTZ"]
# E501: line length is the formatter's job.
# N806/N803: allow non-lowercase names for math-style variables and arguments.
ignore = ["E501", "N806", "N803"]

[tool.ruff.lint.per-file-ignores]
# F401: __init__.py re-exports are not unused imports.
"__init__.py" = ["F401"]
# D100/D103: tests do not need module or function docstrings.
"tests/**" = ["D100", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# --- Pytest Configuration ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

# --- Mypy configuration ---
[tool.mypy]
# Named explicitly because mypy does not respect .gitignore and would otherwise
# descend into .venv. Update the package name when renaming.
files = ["template_repo", "tests"]
ignore_missing_imports = true
follow_untyped_imports = true
